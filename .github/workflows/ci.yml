name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Validation
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    env:
      GI_TYPELIB_PATH: /var/lib/flatpak/runtime/org.gnome.Sdk/x86_64/50/active/files/lib/x86_64-linux-gnu/girepository-1.0:/app/lib/girepository-1.0
      XDG_DATA_DIRS: /var/lib/flatpak/runtime/org.gnome.Sdk/x86_64/50/active/files/share:/usr/local/share:/usr/share
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          pip3 install --break-system-packages ruff meson ninja git+https://gitlab.gnome.org/GNOME/blueprint-compiler.git

      - name: Meson Setup & Tests
        run: |
          meson setup _build
          ninja -C _build test

      - name: Validate AppStream & Desktop Metadata
        run: |
          ninja -C _build cartridges-update-po
          appstreamcli validate --no-net _build/data/*.metainfo.xml
          desktop-file-validate _build/data/*.desktop

  flatpak:
    name: Flatpak Build (Devel)
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Flatpak Builder
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: page.samuelm333.Cartridges.Devel.flatpak
          manifest-path: flatpak/page.samuelm333.Cartridges.Devel.json
          run-tests: true

      - name: Upload Development Flatpak Bundle
        uses: actions/upload-artifact@v4
        with:
          name: page.samuelm333.Cartridges.Devel.flatpak
          path: page.samuelm333.Cartridges.Devel.flatpak
          if-no-files-found: error
