name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Validation
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    env:
      GI_TYPELIB_PATH: /var/lib/flatpak/runtime/org.gnome.Sdk/x86_64/50/active/files/lib/x86_64-linux-gnu/girepository-1.0:/app/lib/girepository-1.0
      XDG_DATA_DIRS: /var/lib/flatpak/runtime/org.gnome.Sdk/x86_64/50/active/files/share:/usr/local/share:/usr/share
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: pip3 install --break-system-packages ruff meson ninja pillow git+https://gitlab.gnome.org/GNOME/blueprint-compiler.git

      - name: Trust Workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Sync Development Tools
        run: uv sync --group dev

      - name: Pre-commit Gates
        run: uv run pre-commit run --all-files

      - name: Set Up GTK Environment
        run: .github/scripts/setup_gtk_env.sh

      - name: Meson Setup
        run: meson setup _build

      - name: Meson Tests
        run: ninja -C _build test

      - name: Validate AppStream & Desktop Metadata
        run: |
          ninja -C _build cartridges-update-po
          appstreamcli validate --no-net _build/data/*.metainfo.xml
          desktop-file-validate _build/data/*.desktop
